<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bem Doçar</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #007BFF;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 2rem;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .product-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      background-color: #f9f9f9;
      transition: transform 0.3s;
      text-decoration: none; /* remove sublinhado */
      color: inherit; /* mantém a cor original */
      display: block; /* para o <a> se comportar como uma div */
    }

    .product-item:hover {
      transform: scale(1.02);
    }

    .product-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product-name {
      padding: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <header>Bem Doçar</header>

  <section class="product-list">
    <div class="product-item">
        <a href="https://biolivre.com.br/bemdocar/199743048-47654fc4-57b9-4d99-94ab-1f643037dea6" class="product-item">
          <img src="https://http2.mlstatic.com/D_725849-MLB83778242330_042025-O.jpg" alt="Produto 1">
          <div class="product-name">Produto 1</div>
        </a>
      </div>
      <div class="product-item">
        <a href="https://biolivre.com.br/bemdocar/199743048-47654fc4-57b9-4d99-94ab-1f643037dea6" class="product-item">
          <img src="https://http2.mlstatic.com/D_725849-MLB83778242330_042025-O.jpg" alt="Produto 2">
          <div class="product-name">Produto 2</div>
        </a>
      </div>
      <div class="product-item">
        <a href="https://biolivre.com.br/bemdocar/199743048-47654fc4-57b9-4d99-94ab-1f643037dea6" class="product-item">
          <img src="https://http2.mlstatic.com/D_725849-MLB83778242330_042025-O.jpg" alt="Produto 3">
          <div class="product-name">Produto 3</div>
        </a>
      </div>
      <div class="product-item">

</html>
